  background-size: cover, cover;
  background-position: center, center top;
  background-repeat: no-repeat, no-repeat;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  min-height: 100dvh;
  padding-block: 0 56px;
}
.wrap {
  max-width: 592px; margin: 0 auto; display: flex; flex-direction: column; gap: 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

header { display: flex; flex-direction: column; gap: 20px; }
.banner {
  display: block; width: 100%;
  height: clamp(170px, 44vw, 260px);
  object-fit: cover; object-position: center 40%;
  border-bottom: 1px solid var(--line);
}
.avatar {
  display: block;
  width: 128px; height: 128px; border-radius: 50%;
  object-fit: cover;
  border: 4px solid var(--bg);
  box-shadow: 0 0 0 2px var(--accent);
  margin: -64px 0 0 0;
  position: relative;
  z-index: 1;
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(2.8rem, 12vw, 4.4rem);
  line-height: 0.98;
  letter-spacing: -0.035em;
  text-wrap: balance;
}
.bio { margin: 0; color: var(--muted); max-width: 44ch; }

.label {
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); margin: 0 0 12px;
}
ul {
  list-style: none; margin: 0; padding: 0;
  background: var(--panel);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}
li + li { border-top: 1px solid var(--line); }

a.row {
  display: grid;
  grid-template-columns: 48px minmax(0, 1fr) auto;
  align-items: center;
  gap: 16px;
  padding: 16px;
  color: inherit;
  text-decoration: none;
  transition: background-color .18s ease, color .18s ease;
}
.tag {
  width: 48px; height: 48px; border-radius: 11px;
  overflow: hidden;
  border: 1px solid var(--line);
  transition: border-color .18s ease;
}
.tag img { display: block; width: 100%; height: 100%; object-fit: cover; }
.name { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; letter-spacing: -0.015em; line-height: 1.2; }
.handle { font-family: var(--font-mono); font-size: 13px; color: var(--muted); overflow-wrap: anywhere; transition: color .18s ease; }
.arrow { font-family: var(--font-mono); font-size: 20px; transition: transform .18s ease; }

a.row:hover, a.row:focus-visible { background: var(--accent); color: var(--on-accent); }
a.row:hover .handle, a.row:focus-visible .handle { color: var(--on-accent); }
a.row:hover .tag, a.row:focus-visible .tag { border-color: var(--on-accent); }
a.row:hover .arrow, a.row:focus-visible .arrow { transform: translateX(4px); }
a.row:focus-visible { outline: 2px solid var(--fg); outline-offset: -2px; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
